<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Korte Music</title>
  <meta name="theme-color" content="#121212" />
  <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
  <!-- Vercel Web Analytics (visitas). Es lo mismo que hace inject() de @vercel/analytics; en HTML sin empaquetador se carga así.
       Solo funciona publicado en Vercel y con "Web Analytics" activado en el proyecto; en local da 404 sin consecuencias. -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="no-track">
  <script src="korte-intro.js" data-wait="app"></script>
    <!-- Íconos propios: los emojis (⏸ 🔀 🔁) cada teléfono los dibuja distinto, a veces en naranja. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
    <symbol id="i-repeat1" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3M11 10h1v4"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/></symbol>
    <symbol id="i-lyrics" viewBox="0 0 24 24"><path d="M4 6h16M4 11h16M4 16h10"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
    <symbol id="i-volume-off" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM22 9l-6 6M16 9l6 6"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
    <symbol id="i-bars" viewBox="0 0 24 24"><path d="M4 10v4M8 6v12M12 3v18M16 8v8M20 11v2"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M5 10v10h5v-6h4v6h5V10"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M5 3v18M10 3v18M15 5l5 15"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM19 11a7 7 0 0 1-14 0M12 18v3"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar">
      <div class="brand"><img class="brand-mark" src="assets/logo-icon.svg" alt="" /> Korte <span class="brand-accent">Music</span></div>

      <nav class="nav">
        <a href="#/" class="nav-item active" id="nav-home">Inicio</a>
        <a href="#/songs" class="nav-item" id="nav-songs"><svg class="ic ic-sm"><use href="#i-music"/></svg>Canciones</a>
        <a href="#/artists" class="nav-item" id="nav-artists"><svg class="ic ic-sm"><use href="#i-mic"/></svg>Artistas</a>
        <a href="#/private" class="nav-item" id="nav-private"><svg class="ic ic-sm"><use href="#i-lock"/></svg>Privado</a>
        <a href="#/library" class="nav-item" id="nav-library"><svg class="ic ic-sm"><use href="#i-library"/></svg>Me gusta</a>
        <button type="button" class="nav-item admin-only" id="nav-upload">Subir canción</button>
      </nav>

      <div class="library">
        <div class="library-head">
          <span>Tu biblioteca</span>
          <button type="button" class="icon-btn admin-only" id="open-upload" aria-label="Subir canción" title="Subir canción">+</button>
        </div>
        <ul id="library-list"></ul>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <input type="search" id="search" placeholder="¿Qué quieres reproducir?" autocomplete="off" />
        <a href="#/account" class="account-btn" id="nav-account" aria-label="Cuenta" title="Cuenta"><svg class="ic"><use href="#i-user"/></svg></a>
      </header>

      <p id="status" role="status"></p>
      <div id="view"></div>
    </main>

    <section id="viz" hidden>
      <canvas id="viz-canvas"></canvas>
      <div class="viz-controls">
        <div class="viz-modes" id="viz-modes" role="tablist" aria-label="Modelo de visualización"></div>
        <div class="viz-palettes" id="viz-palettes" aria-label="Paleta de colores"></div>
      </div>
      <div class="viz-info">
        <div class="viz-title" id="viz-title">Nada en reproducción</div>
        <div class="viz-artist" id="viz-artist"></div>
      </div>
      <div class="viz-btns">
        <button type="button" class="icon-btn" id="viz-full" aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
        <button type="button" class="icon-btn" id="viz-close" aria-label="Cerrar visualizador" title="Cerrar (Esc)">✕</button>
      </div>
    </section>

    <footer class="player">
      <div class="np">
        <div class="np-cover" id="np-cover"></div>
        <div class="np-text">
          <div class="np-title" id="np-title">Nada en reproducción</div>
          <div class="np-artist" id="np-artist">&nbsp;</div>
        </div>
      </div>

      <div class="controls">
        <div class="buttons">
          <button type="button" class="ctrl" id="prev" aria-label="Anterior"><svg class="ic fill"><use href="#i-prev"/></svg></button>
          <button type="button" class="ctrl play" id="play" aria-label="Reproducir / pausa"><svg class="ic fill"><use href="#i-play"/></svg></button>
          <button type="button" class="ctrl" id="next" aria-label="Siguiente"><svg class="ic fill"><use href="#i-next"/></svg></button>
        </div>
        <div class="seek">
          <span id="time-cur">0:00</span>
          <input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Progreso" />
          <span id="time-dur">0:00</span>
        </div>
      </div>

      <div class="volume">
        <button type="button" class="ctrl" id="lyrics-open" aria-label="Letra" title="Letra" aria-pressed="false" hidden><svg class="ic"><use href="#i-lyrics"/></svg></button>
        <button type="button" class="ctrl" id="viz-open" aria-label="Visualizador" title="Visualizador"><svg class="ic"><use href="#i-bars"/></svg></button>
        <svg class="ic vol-ic" id="volume-icon" aria-hidden="true"><use href="#i-volume"/></svg>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1" aria-label="Volumen" />
      </div>

      <!-- Reproductor nativo de HTML; se controla con los botones de arriba. -->
      <!-- crossorigin: necesario para que el analizador pueda leer el audio de otro origen. -->
      <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
    </footer>
  </div>

  <!-- Pantalla de reproducción: se abre al tocar el mini reproductor. -->
  <section id="nowplaying" class="nowplaying" hidden aria-label="Reproduciendo">
    <header class="npf-top">
      <button type="button" class="npf-icon" id="npf-close" aria-label="Cerrar" title="Cerrar"><svg class="ic"><use href="#i-down"/></svg></button>
      <span class="npf-kicker" id="npf-kicker">Reproduciendo</span>
      <span></span>
    </header>

    <div class="npf-art"><div class="npf-cover" id="npf-cover"></div></div>
    <div class="npf-lyrics" id="npf-lyrics" hidden aria-live="off"></div>

    <div class="npf-meta">
      <div class="npf-info">
        <h2 id="npf-title"></h2>
        <p id="npf-artist"></p>
        <span id="npf-plays"></span>
      </div>
      <button type="button" class="npf-like" id="npf-like" aria-label="Me gusta" aria-pressed="false">
        <svg class="ic" id="npf-heart"><use href="#i-heart"/></svg>
        <span id="npf-likes">0</span>
      </button>
    </div>

    <div class="npf-seek">
      <canvas id="npf-snake" tabindex="0" role="slider" aria-label="Progreso de la canción" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></canvas>
      <div class="npf-times"><span id="npf-cur">0:00</span><span id="npf-dur">0:00</span></div>
    </div>

    <div class="npf-controls">
      <button type="button" class="npf-btn" id="npf-shuffle" aria-label="Aleatorio" aria-pressed="false"><svg class="ic"><use href="#i-shuffle"/></svg></button>
      <button type="button" class="npf-btn" id="npf-prev" aria-label="Anterior"><svg class="ic fill"><use href="#i-prev"/></svg></button>
      <button type="button" class="npf-play" id="npf-play" aria-label="Reproducir / pausa"><svg class="ic fill"><use href="#i-play"/></svg></button>
      <button type="button" class="npf-btn" id="npf-next" aria-label="Siguiente"><svg class="ic fill"><use href="#i-next"/></svg></button>
      <button type="button" class="npf-btn" id="npf-repeat" aria-label="Repetir canción" aria-pressed="false"><svg class="ic"><use href="#i-repeat"/></svg></button>
    </div>

    <div class="npf-foot">
      <button type="button" class="npf-link" id="npf-lyrics-btn" hidden aria-pressed="false"><svg class="ic"><use href="#i-lyrics"/></svg>Letra</button>
      <button type="button" class="npf-link" id="npf-viz"><svg class="ic"><use href="#i-bars"/></svg>Visualizador</button>
      <button type="button" class="npf-link" id="npf-share"><svg class="ic"><use href="#i-share"/></svg><span id="npf-share-label">Compartir</span></button>
    </div>
  </section>

  <!-- Navegación inferior: solo se ve en el celular (el menú lateral no cabe). -->
  <nav class="tabbar" aria-label="Navegación">
    <a href="#/" class="tab active" id="tab-home"><svg class="ic"><use href="#i-home"/></svg>Inicio</a>
    <a href="#/search" class="tab" id="tab-search"><svg class="ic"><use href="#i-search"/></svg>Buscar</a>
    <a href="#/artists" class="tab" id="tab-artists"><svg class="ic"><use href="#i-mic"/></svg>Artistas</a>
    <a href="#/private" class="tab" id="tab-private"><svg class="ic"><use href="#i-lock"/></svg>Privado</a>
    <a href="#/library" class="tab" id="tab-library"><svg class="ic"><use href="#i-library"/></svg>Biblioteca</a>
  </nav>

  <div id="song-menu" class="song-menu" role="menu" hidden>
    <button type="button" role="menuitem" id="menu-edit">Editar</button>
    <button type="button" role="menuitem" id="menu-delete" class="danger">Eliminar</button>
  </div>

  <dialog id="edit-dialog">
    <form id="edit-form">
      <h2>Editar canción</h2>
      <label>Título <input type="text" name="title" required maxlength="200" /></label>
      <label>Artista <input type="text" name="artist" required maxlength="200" /></label>
      <label>Nueva portada (opcional) <input type="file" name="cover" accept="image/jpeg,image/png,image/webp" /></label>
      <label class="check" id="edit-remove-wrap"><input type="checkbox" name="remove_cover" value="true" /> Quitar la portada actual</label>
      <label>Letra (opcional) <textarea name="lyrics" rows="6" maxlength="20000" placeholder="Una frase por línea. Con tiempos: [0:12.50] frase" disabled></textarea></label>
      <p id="edit-status" role="status"></p>
      <div class="dialog-actions">
        <button type="button" class="btn-ghost" id="cancel-edit">Cancelar</button>
        <button type="submit" class="btn-primary" id="submit-edit">Guardar</button>
      </div>
    </form>
  </dialog>

  <dialog id="artist-dialog">
    <form id="artist-form">
      <h2 id="artist-dialog-title">Perfil del artista</h2>
      <input type="hidden" name="name" />
      <label id="artist-name-wrap" hidden>Nombre artístico <input type="text" id="artist-name-input" maxlength="200" placeholder="Cómo te conocen" autocomplete="off" /></label>
      <label id="artist-city-wrap" hidden>Ciudad (opcional) <input type="text" name="city" maxlength="100" placeholder="Santiago" autocomplete="off" /></label>
      <label>Biografía <textarea name="bio" rows="5" maxlength="2000" placeholder="Cuenta quién es, de dónde viene, su historia…"></textarea></label>
      <label>Instagram (opcional) <input type="text" name="instagram" maxlength="200" placeholder="@usuario o enlace" /></label>
      <label>Foto de perfil (opcional) <input type="file" name="image" accept="image/jpeg,image/png,image/webp" /></label>
      <label class="check" id="artist-remove-wrap"><input type="checkbox" name="remove_image" value="true" /> Quitar la foto actual</label>
      <p id="artist-status" role="status"></p>
      <div class="dialog-actions">
        <button type="button" class="btn-ghost" id="cancel-artist">Cancelar</button>
        <button type="submit" class="btn-primary" id="submit-artist">Guardar</button>
      </div>
    </form>
  </dialog>

  <dialog id="upload-dialog">
    <form id="upload-form">
      <h2>Subir canción</h2>
      <label>Título <input type="text" name="title" required maxlength="200" /></label>
      <label>Artista <input type="text" name="artist" required maxlength="200" /></label>
      <label>Archivo de audio <input type="file" name="file" accept=".mp3,.wav,.ogg,.m4a,.flac,audio/*" required /></label>
      <label>Portada (opcional) <input type="file" name="cover" accept="image/jpeg,image/png,image/webp" /></label>
      <label class="check"><input type="checkbox" name="is_private" value="true" /> Privada (solo tú la ves)</label>
      <p id="upload-status" role="status"></p>
      <div class="dialog-actions">
        <button type="button" class="btn-ghost" id="cancel-upload">Cancelar</button>
        <button type="submit" class="btn-primary" id="submit-upload">Subir</button>
      </div>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="auth.js"></script>
  <script src="visualizer.js"></script>
  <script src="app.js"></script>
</body>
</html>
