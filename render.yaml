services:
  - type: web
    name: korte-music-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false # Supabase > Connect > Session pooler (cadena postgresql://...)
      - key: SUPABASE_URL
        sync: false # https://<proyecto>.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false # Supabase > Project Settings > API Keys > service_role (secreta)
      - key: MAX_UPLOAD_MB
        value: "50" # tope del plan gratuito de Supabase Storage
      - key: CORS_ORIGINS
        sync: false # URL de Vercel, p. ej. https://korte-music.vercel.app
